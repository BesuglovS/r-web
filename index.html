<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание — Ученики</title>
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
    <div class="header">
        <h1>Расписание</h1>
        <div class="header-right">
            <button class="theme-btn" id="themeToggle" aria-label="Сменить тему">
                <span class="icon-sun">&#9788;</span>
                <span class="icon-moon">&#9790;</span>
            </button>
            <nav class="nav">
                <a href="index.html" class="active">Ученики</a>
                <a href="teachers.html">Учителя</a>
            </nav>
        </div>
    </div>

    <div class="controls">
        <div class="select-wrap">
            <select id="classSelect">
                <option value="">Выберите класс</option>
            </select>
        </div>
        <div class="select-wrap week-select-wrap">
            <select id="weekSelect"></select>
        </div>
        <div class="day-tabs" id="dayTabs"></div>
    </div>

    <div class="content" id="scheduleContent">
        <div class="empty-state">Выберите класс для просмотра расписания</div>
    </div>

    <div class="last-import" id="lastImport"></div>

    <button id="historyToggle" class="day-tab history-btn">Что изменилось?</button>
    <div class="content" id="historyBox"></div>

    <script src="app.js?v=24"></script>
</body>
</html>
