<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание — Ученики</title>
    <link rel="icon" href="favicon.ico?v=2" type="image/x-icon">
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="stylesheet" href="style.css?v=24">
</head>
<body>
    <div class="header">
        <h1>Расписание</h1>
        <div class="header-right">
            <button class="theme-btn" id="themeToggle" aria-label="Сменить тему">
                <span class="icon-sun">&#9788;</span>
                <span class="icon-moon">&#9790;</span>
            </button>
            <a href="school.html" class="school-btn" aria-label="Расписание научной школы" title="Расписание научно-творческой школы">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 10 12 5 2 10l10 5 10-5Z"/>
                    <path d="M6 12v5c0 1.1 2.7 2 6 2s6-.9 6-2v-5"/>
                    <path d="M22 10v6"/>
                </svg>
                <span class="school-btn-text">Школа</span>
            </a>
            <a href="android.html" class="android-btn" aria-label="Скачать приложение для Android" title="Скачать приложение для Android">
                <img src="android-icon.png" alt="" width="17" height="17">
            </a>
            <nav class="nav">
                <a href="index.html" class="active">Ученики</a>
                <a href="teachers.html">Учителя</a>
                <a href="free.html">Аудитории</a>
            </nav>
        </div>
    </div>

    <div class="controls">
        <div class="select-wrap">
            <select id="classSelect">
                <option value="">Выберите класс</option>
            </select>
        </div>
        <div class="select-wrap week-select-wrap">
            <select id="weekSelect"></select>
        </div>
        <div class="day-tabs" id="dayTabs"></div>
    </div>

    <div class="content" id="scheduleContent">
        <div class="empty-state">Выберите класс для просмотра расписания</div>
    </div>

    <div class="last-import" id="lastImport"></div>

    <button id="historyToggle" class="day-tab history-btn">Что изменилось?</button>
    <div class="content" id="historyBox"></div>

    <div class="page-footer"><a href="privacy.html">Политика конфиденциальности</a></div>
    <script src="app.js?v=25"></script>
</body>
</html>
